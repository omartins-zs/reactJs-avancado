services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reactjs-avancado-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reactjs_avancado
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - reactjs_network

  nginx:
    image: nginx:1.27-alpine
    container_name: reactjs-avancado-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - reactjs_network

  mysql:
    image: mysql:8.0
    container_name: reactjs-avancado-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reactjs_avancado
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reactjs_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: reactjs-avancado-phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - reactjs_network

volumes:
  mysql_data:

networks:
  reactjs_network:
    driver: bridge
